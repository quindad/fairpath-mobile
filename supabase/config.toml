# Supabase CLI project config.
#
# ENVIRONMENTS (two completely separate Supabase projects):
#   fairpath-mobile      ref rqpczemdagoddhuwefxt  PRODUCTION — never migrate/push/repair from this repo.
#   fairpath-mobile-dev  ref znvhmuhojvwvjzmaqwff  DEVELOPMENT — the only project this repo is linked to.
#
# The link itself lives in supabase/.temp/project-ref (gitignored). Before ANY
# `supabase db push` / schema-mutating command, run:
#     cat supabase/.temp/project-ref      # must print znvhmuhojvwvjzmaqwff
# See supabase/README.md and supabase/baseline/README.md for the full runbook.
#
# project_id below is only a local CLI label (used for local Docker naming). It
# is not a credential and does not select which remote project commands target.

project_id = "fairpath-mobile-dev"

[db]
# Matches the remote Postgres major version (fairpath-mobile-dev runs 17.x).
major_version = 17
